<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Experimental video accompanying FH-Balanced dynamic docking planning.">
  <title>FH-Balanced | Experimental Video</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182b3c; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 40px, 1040px); margin: 64px auto; }
    .label { color: #315f80; font-size: .8rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.08; letter-spacing: -.035em; }
    .title { max-width: 800px; margin: 0; color: #526171; font-size: clamp(1rem, 2.2vw, 1.25rem); line-height: 1.65; }
    section { margin-top: 36px; padding: 24px; background: white; border: 1px solid #dce3e9; border-radius: 12px; }
    h2 { font-size: 1.1rem; margin: 0 0 20px; }
    video { display: block; width: 100%; max-height: 72vh; background: #101923; border-radius: 6px; }
    video[hidden], [hidden] { display: none; }
    #status { padding: 64px 20px; text-align: center; background: #f2f5f8; border-radius: 6px; color: #526171; }
    a { color: #245c88; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #245c88; outline-offset: 4px; }
    .download { margin: 18px 0 0; font-size: .9rem; }
    footer { margin-top: 20px; color: #637181; font-size: .85rem; }
    @media (max-width: 600px) { main { width: calc(100% - 28px); margin: 32px auto; } section { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="label">Supplementary material</div>
      <h1>FH-Balanced</h1>
      <p class="title">Dynamic Docking Planning: Balancing Docking Efficiency and Post-Lock Same-Track Recovery</p>
    </header>
    <section aria-labelledby="video-heading">
      <h2 id="video-heading">Experimental video</h2>
      <p id="status" role="status">The experimental video is currently unavailable. Please check back later.</p>
      <video id="experiment-video" controls playsinline preload="metadata" aria-label="FH-Balanced experimental video" hidden>
        <source id="video-source" src="video.mp4" type="video/mp4">
        Your browser does not support embedded video. <a href="video.mp4">Download the video</a>.
      </video>
      <p id="download" class="download" hidden><a href="video.mp4" download>Download video (MP4)</a></p>
      <noscript><p>JavaScript is disabled. <a href="video.mp4">Open the experimental video</a>.</p></noscript>
    </section>
    <footer>Experimental video accompanying the paper.</footer>
  </main>
  <script>
    const video = document.getElementById('experiment-video');
    const status = document.getElementById('status');
    const download = document.getElementById('download');
    function showVideo() {
      video.hidden = false;
      status.hidden = true;
      download.hidden = false;
    }
    function showUnavailable() {
      video.hidden = true;
      status.hidden = false;
      download.hidden = true;
    }
    video.addEventListener('loadedmetadata', showVideo);
    video.addEventListener('error', showUnavailable);
    document.getElementById('video-source').addEventListener('error', showUnavailable);
    if (video.readyState >= 1) showVideo();
  </script>
</body>
</html>
